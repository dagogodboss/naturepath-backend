# Zero-spam trigger: human runs this AFTER Entra admin consent Accept.
# Does not poll. Staging cutover by default; prod is never enabled here.
#
# PRIMARY when IAP is down (ops laptop): Secret Manager local path — no IAP:
#   ./scripts/phase6_post_consent_cutover_local.sh --dry-run
# Full staging cutover without IAP: run that script on naturepath-data-1 (VPC Mongo).
#
# This workflow: Workload Identity → IAP SSH → VM. Org policy enforces
# iam.disableServiceAccountKeyCreation, so GCP_SA_KEY cannot be created here.
#
#   gh workflow run phase6-post-consent-cutover.yml --repo dagogodboss/naturepath-backend
#   gh workflow run phase6-post-consent-cutover.yml -f mode=dry-run
#
# If an org-policy exception ever allows a key:
#   gcloud iam service-accounts keys create /tmp/phase6-gha.json \
#     --iam-account=github-actions-phase6@project-990664b0-1bae-4746-88d.iam.gserviceaccount.com \
#     --project=project-990664b0-1bae-4746-88d
#   gh secret set GCP_SA_KEY --repo dagogodboss/naturepath-backend < /tmp/phase6-gha.json
#   rm -f /tmp/phase6-gha.json
#   (then switch auth step to credentials_json: ${{ secrets.GCP_SA_KEY }})

name: Phase 6 post-consent cutover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (probe only) or staging (full cutover)"
        type: choice
        options:
          - dry-run
          - staging
        default: staging
      sync_code:
        description: "Rsync this repo checkout to the VM before running"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: project-990664b0-1bae-4746-88d
      GCP_ZONE: us-central1-a
      GCP_INSTANCE: naturepath-data-1
      # projects/30255322344/locations/global/workloadIdentityPools/github-actions/providers/github
      WIF_PROVIDER: projects/30255322344/locations/global/workloadIdentityPools/github-actions/providers/github
      WIF_SERVICE_ACCOUNT: github-actions-phase6@project-990664b0-1bae-4746-88d.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, else GCP_SA_KEY)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          # Fallback only if org policy ever allows a key and secret is set:
          # credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run cutover on naturepath-data-1 (IAP SSH)
        run: |
          set -euo pipefail
          chmod +x scripts/phase6_post_consent_cutover_remote.sh
          ARGS=()
          if [[ "${{ inputs.sync_code }}" == "true" ]]; then
            ARGS+=(--sync-code)
          fi
          if [[ "${{ inputs.mode }}" == "dry-run" ]]; then
            ARGS+=(--dry-run)
          fi
          ./scripts/phase6_post_consent_cutover_remote.sh "${ARGS[@]}"
